<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickBite | Smart Canteen</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #111827;
      text-align: center;
    }
    header {
      background: linear-gradient(135deg, #f97316, #e11d48);
      color: white;
      padding: 55px 20px;
    }
    h1 { font-size: 48px; margin: 0 0 12px; }
    main {
      max-width: 700px;
      margin: 35px auto;
      padding: 25px;
    }
    .card {
      background: white;
      padding: 28px;
      border-radius: 16px;
      box-shadow: 0 4px 15px #0001;
    }
    button {
      background: #f97316;
      color: white;
      border: 0;
      border-radius: 8px;
      padding: 13px 22px;
      font-size: 16px;
      cursor: pointer;
    }
    footer { padding: 20px; color: #6b7280; }
  </style>
</head>
<body>
  <header>
    <h1>QuickBite</h1>
    <p>Skip the queue. Enjoy your food.</p>
    <p>Smart Campus Canteen Management System</p>
  </header>
  <main>
    <div class="card">
      <h2>Welcome to QuickBite!</h2>
      <p>Pre-order food, track your token, and check canteen stock.</p>
      <p>This project is built using Java Swing and MySQL.</p>
      <button onclick="alert('QuickBite Java desktop application. The online ordering system requires a web backend.')">
        Explore QuickBite
      </button>
    </div>
  </main>
  <footer>QuickBite | Smart Canteen Management</footer>
</body>
</html>
